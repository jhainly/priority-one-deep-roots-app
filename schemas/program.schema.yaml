program:
  id: priority-one-deep-roots-week-5
  title: Deep Roots
  version: "1.0.0"
  description: Week Five Mission from the Deep Roots weekly missions format.
weeks:
  - weekNumber: 5
    title: Week Five Mission
    summary: Complete by Friday at midnight. The app automatically tracks individual and team scores.
    days:
      - dayNumber: 1
        label: Weekly Missions
        title: Weekly Missions
        sections:
          - id: weekly-check-in
            title: Weekly Check-In
            body: Review your Week Five mission progress in the app by Friday at midnight.
            points: 1
          - id: aerobic-exercise
            title: Aerobic Exercise
            body: 20 minutes, 3 days this week.
            completionUnit: day
            maxCompletions: 3
            points: 3
            pointsPerCompletion: 1
      - dayNumber: 2
        label: Monday
        title: Reading and Reflection
        sections:
          - id: growth-challenge
            title: Growth & Challenge
            body: Write your answer to the daily reflection question.
            points: 1
            prompts:
              - id: monday-growth
                label: Why do you live where you live? What went into that decision?
          - id: spiritual-action
            title: "Spiritual Action: Reading and Reflection"
            body: Read Matthew 17:1-13.
            breathPrayer:
              - inhale: Lord Jesus...
                exhale: Help me follow You.
            points: 1
            prompts:
              - id: monday-q1
                label: What is God teaching you through today's reading?
